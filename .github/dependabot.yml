version: 2
updates:
  # Mantiene al día las versiones de las actions usadas en los workflows y en la action local.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/terraform-init"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "actions"

  # Mantiene al día el proveedor azurerm (y actualiza .terraform.lock.hcl).
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "terraform"

  # La app no tiene dependencias hoy; esto te avisa el día que agregues alguna.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
