name: 03 · Desplegar (dev → prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez. Si llega otro, espera su turno (nunca se cancela a mitad de un apply).
concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  construir:
    name: Construir y probar
    uses: ./.github/workflows/01-integracion-continua.yml

  dev:
    name: dev
    needs: construir
    uses: ./.github/workflows/desplegar-ambiente.yml
    with:
      ambiente: dev
    permissions:
      contents: read
      id-token: write

  prod:
    name: prod
    needs: dev
    uses: ./.github/workflows/desplegar-ambiente.yml
    with:
      ambiente: prod
    permissions:
      contents: read
      id-token: write
