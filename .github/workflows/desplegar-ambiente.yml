name: Desplegar ambiente (reutilizable)

# No se ejecuta solo: lo llama 03-desplegar.yml una vez por ambiente.
# Un solo archivo para dev y prod garantiza que los dos se despliegan EXACTAMENTE igual.
on:
  workflow_call:
    inputs:
      ambiente:
        description: dev o prod
        type: string
        required: true

permissions:
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_suscripcion_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_nombre_app: ${{ vars.NOMBRE_APP || 'contosobiker' }}
  TF_VAR_ubicacion: ${{ vars.UBICACION || 'eastus2' }}
  TF_VAR_etiquetas_extra: ${{ vars.ETIQUETAS_EXTRA || '{}' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  planificar:
    name: Planificar ${{ inputs.ambiente }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          ambiente: ${{ inputs.ambiente }}

      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan -no-color \
            -var-file="environments/${{ inputs.ambiente }}.tfvars" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Resumen del plan
        working-directory: infra
        run: |
          {
            echo "### 🧱 Plan · \`${{ inputs.ambiente }}\`"
            echo ""
            echo '```text'
            tail -c 20000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Lo que se aprueba es ESTE plan. El apply de abajo ejecuta este mismo archivo,
      # no calcula uno nuevo: lo que el aprobador vio es lo que se aplica.
      - name: Guardar el plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.ambiente }}
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 5

  publicar:
    name: Aplicar y publicar ${{ inputs.ambiente }}
    needs: planificar
    runs-on: ubuntu-latest

    # Aquí actúan las reglas del entorno: aprobadores y ramas permitidas.
    # Además, el token de OIDC lleva el nombre del entorno, y Azure solo lo acepta si coincide.
    environment:
      name: ${{ inputs.ambiente }}
      url: ${{ steps.salidas.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Descargar el plan aprobado
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.ambiente }}
          path: infra

      - name: Descargar el sitio construido
        uses: actions/download-artifact@v8
        with:
          name: sitio-web
          path: app/dist

      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          ambiente: ${{ inputs.ambiente }}

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -no-color tfplan

      - name: Leer salidas de Terraform
        id: salidas
        working-directory: infra
        run: |
          echo "url=$(terraform output -raw url_sitio)" >> "$GITHUB_OUTPUT"
          echo "cuenta=$(terraform output -raw nombre_cuenta)" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El paquete es el mismo en dev y prod; solo cambia este archivo.
      - name: Escribir la configuración del ambiente
        run: |
          VERSION="$(node -p "require('./app/package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"
          node app/scripts/escribir-config.mjs "${{ inputs.ambiente }}" "$VERSION" "${{ github.sha }}"

      - name: Publicar el sitio en Azure Storage
        env:
          CUENTA: ${{ steps.salidas.outputs.cuenta }}
        run: |
          az storage blob upload-batch \
            --account-name "$CUENTA" \
            --destination '$web' \
            --source app/dist \
            --auth-mode login \
            --overwrite true \
            --output none

      - name: Prueba de humo
        env:
          URL: ${{ steps.salidas.outputs.url }}
          AMBIENTE: ${{ inputs.ambiente }}
          COMMIT: ${{ github.sha }}
        run: |
          esperado="${COMMIT:0:7}"
          for intento in $(seq 1 12); do
            config="$(curl -fsS "$URL/config.json" || true)"
            if [ "$(echo "$config" | jq -r '.ambiente // empty')" = "$AMBIENTE" ] \
               && [ "$(echo "$config" | jq -r '.commit // empty')" = "$esperado" ] \
               && curl -fsS "$URL/" | grep -q "Contoso Biker"; then
              echo "✅ $URL responde con el ambiente $AMBIENTE y el commit $esperado"
              {
                echo "### 🚀 Publicado en \`$AMBIENTE\`"
                echo ""
                echo "- 🌐 $URL"
                echo "- 🔖 commit \`$esperado\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $intento: el sitio aún no responde con lo esperado..."
            sleep 10
          done
          echo "::error::La prueba de humo falló en $URL"
          exit 1
