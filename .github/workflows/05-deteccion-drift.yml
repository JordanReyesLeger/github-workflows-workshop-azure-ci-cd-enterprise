name: 05 · Detección de drift (extra)

# Compara lo que dice el código con lo que existe en Azure. Si alguien cambió algo a mano
# en el portal, este workflow falla y te avisa.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TF_VAR_suscripcion_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_nombre_app: ${{ vars.NOMBRE_APP || 'contosobiker' }}
  TF_VAR_ubicacion: ${{ vars.UBICACION || 'eastus2' }}
  TF_VAR_etiquetas_extra: ${{ vars.ETIQUETAS_EXTRA || '{}' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  drift:
    name: Drift ${{ matrix.ambiente }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        ambiente: [dev, prod]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          ambiente: ${{ matrix.ambiente }}

      # Código de salida: 0 = sin cambios, 1 = error, 2 = hay diferencias.
      - name: Terraform plan (detectar diferencias)
        working-directory: infra
        run: |
          set +e
          terraform plan -detailed-exitcode -lock=false -no-color \
            -var-file="environments/${{ matrix.ambiente }}.tfvars"
          codigo=$?
          if [ "$codigo" -eq 2 ]; then
            echo "### ⚠️ Drift en \`${{ matrix.ambiente }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Azure difiere del código. Revisa el log del paso." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $codigo
