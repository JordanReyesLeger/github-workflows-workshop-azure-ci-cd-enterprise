name: App · desplegar ambiente (reutilizable)

# Solo aplicación. NO ejecuta Terraform: la Web App ya existe (la crea 03-infra-desplegar).
# Lo llama 04-app-desplegar.yml una vez por ambiente.
on:
  workflow_call:
    inputs:
      ambiente:
        description: dev o prod
        type: string
        required: true

permissions:
  contents: read

env:
  NOMBRE_APP: ${{ vars.NOMBRE_APP || 'contosobiker' }}

jobs:
  publicar:
    name: Publicar ${{ inputs.ambiente }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.ambiente }}
      url: ${{ steps.destino.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar el paquete construido
        uses: actions/download-artifact@v8
        with:
          name: app-web

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El contrato entre los dos pipelines es el nombre del grupo: rg-<app>-<ambiente>.
      # Así la app no depende de cómo Terraform nombre la Web App.
      - name: Localizar la Web App en Azure
        id: destino
        env:
          GRUPO: rg-${{ env.NOMBRE_APP }}-${{ inputs.ambiente }}
        run: |
          app="$(az webapp list --resource-group "$GRUPO" --query "[0].name" -o tsv 2>/dev/null || true)"
          host="$(az webapp list --resource-group "$GRUPO" --query "[0].defaultHostName" -o tsv 2>/dev/null || true)"
          if [ -z "$app" ] || [ -z "$host" ]; then
            echo "::error::No hay Web App en $GRUPO. Ejecuta primero '03 · Infra · desplegar'."
            exit 1
          fi
          echo "grupo=$GRUPO" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Desplegar en App Service
        env:
          GRUPO: ${{ steps.destino.outputs.grupo }}
          APP: ${{ steps.destino.outputs.app }}
        run: |
          az webapp deploy \
            --resource-group "$GRUPO" \
            --name "$APP" \
            --src-path app.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Prueba de humo
        env:
          URL: ${{ steps.destino.outputs.url }}
          AMBIENTE: ${{ inputs.ambiente }}
          COMMIT: ${{ github.sha }}
        run: |
          esperado="${COMMIT:0:7}"
          # Un arranque en frío de .NET puede tardar un par de minutos.
          for intento in $(seq 1 30); do
            info="$(curl -fsS --max-time 20 "$URL/api/info" || true)"
            if [ "$(echo "$info" | jq -r '.ambiente // empty')" = "$AMBIENTE" ] \
               && [ "$(echo "$info" | jq -r '.commit // empty')" = "$esperado" ] \
               && curl -fsS --max-time 20 "$URL/health" | grep -q ok \
               && curl -fsS --max-time 20 "$URL/" | grep -q "Contoso Biker"; then
              echo "✅ $URL responde con el ambiente $AMBIENTE y el commit $esperado"
              {
                echo "### 🚀 Publicado en \`$AMBIENTE\`"
                echo ""
                echo "- 🌐 $URL"
                echo "- 🔖 commit \`$esperado\`"
                echo "- ⚙️ \`$(echo "$info" | jq -c '{ambiente, version, runtime}')\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $intento: la app aún no responde con lo esperado..."
            sleep 10
          done
          echo "::error::La prueba de humo falló en $URL"
          exit 1
