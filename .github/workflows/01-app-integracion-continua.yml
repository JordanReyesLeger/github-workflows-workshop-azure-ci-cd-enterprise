name: 01 · App · integración continua

on:
  pull_request:
    branches: ["main"]
  # Lo llama también el despliegue (04), así hay UNA sola definición de "construir".
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION_DOTNET: "10.0.x"

jobs:
  construir-y-probar:
    name: Construir y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.VERSION_DOTNET }}

      - name: Restaurar dependencias
        run: dotnet restore ContosoBiker.sln

      - name: Compilar
        run: dotnet build ContosoBiker.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test ContosoBiker.sln --configuration Release --no-build

      - name: Publicar la aplicación
        run: dotnet publish src/ContosoBiker.Web --configuration Release --no-build --output publicar

      # La versión y el commit viajan DENTRO del paquete: es el mismo paquete en dev y en prod.
      - name: Estampar la versión y el commit
        env:
          COMMIT: ${{ github.sha }}
          NUMERO: ${{ github.run_number }}
        run: |
          printf '{"version":"1.0.%s","commit":"%s"}\n' "$NUMERO" "${COMMIT:0:7}" > publicar/buildinfo.json
          cat publicar/buildinfo.json

      - name: Empaquetar
        working-directory: publicar
        run: zip -qr ../app.zip .

      - name: Guardar el paquete
        uses: actions/upload-artifact@v7
        with:
          name: app-web
          path: app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Resumen
        run: |
          {
            echo "### 📦 Paquete construido"
            echo ""
            echo "- Tamaño: $(stat -c %s app.zip) bytes"
            echo "- \`$(cat publicar/buildinfo.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
